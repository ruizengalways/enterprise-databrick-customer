name: Validate reference customer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-local:
    runs-on: ubuntu-latest
    env:
      CUSTOMER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact customer source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CUSTOMER_SHA }}
          path: customer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser for machine contracts
        run: pip install 'PyYAML>=6,<7'

      - name: Read exact framework lock as YAML
        id: lock
        working-directory: customer
        shell: bash
        run: |
          set -euo pipefail
          ref=$(python - <<'PY'
          import yaml
          with open('certification/framework-lock.yml', encoding='utf-8') as handle:
              print(yaml.safe_load(handle)['framework']['ref'])
          PY
          )
          test ${#ref} -eq 40
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout exact framework SHA
        uses: actions/checkout@v4
        with:
          repository: ruizengalways/enterprise-databrick-framework
          ref: ${{ steps.lock.outputs.ref }}
          path: customer/.framework

      - name: Install framework under test and test tools
        working-directory: customer
        run: |
          python -m pip install --upgrade pip
          pip install ./.framework
          pip install 'pytest>=8,<10' 'ruff>=0.6,<1'

      - name: Verify exact source checkouts and package version
        working-directory: customer
        env:
          FRAMEWORK_SHA: ${{ steps.lock.outputs.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CUSTOMER_SHA"
          test "$(git -C .framework rev-parse HEAD)" = "$FRAMEWORK_SHA"
          python - <<'PY'
          import tomllib
          import yaml
          with open('certification/framework-lock.yml', encoding='utf-8') as handle:
              lock = yaml.safe_load(handle)
          with open('.framework/pyproject.toml', 'rb') as handle:
              actual = tomllib.load(handle)['project']['version']
          expected = lock['framework']['expected_package_version']
          assert actual == expected, f'expected framework package {expected}, got {actual}'
          PY

      - name: Validate customer metadata through framework CLI
        working-directory: customer
        run: edp validate metadata/table_specs

      - name: Compile Databricks and evidence Python sources
        working-directory: customer
        run: python -m compileall -q src scripts tests

      - name: Lint customer harness
        working-directory: customer
        run: ruff check src scripts tests

      - name: Run deterministic customer certification tests
        working-directory: customer
        run: pytest -q

      - name: Build certification evidence
        working-directory: customer
        env:
          FRAMEWORK_SHA: ${{ steps.lock.outputs.ref }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: python scripts/build_certification_evidence.py --output certification-evidence.json

      - name: Upload certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: certification-evidence-${{ env.CUSTOMER_SHA }}
          path: customer/certification-evidence.json
          if-no-files-found: error
